
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171719">
  <title> </title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #171719;
      color: #e5e5e7;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    main {
      text-align: center;
      padding: 24px;
    }

    .date {
      font-size: 14px;
      color: #77777f;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .days {
      font-size: clamp(76px, 18vw, 120px);
      font-weight: 500;
      letter-spacing: -5px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: 18px;
      color: #929298;
      margin-top: 16px;
    }

    .heart {
      color: #87505c;
      font-size: 17px;
      margin-top: 28px;
    }
  </style>
</head>
<body>
  <main>
    <div class="date">2026.10.14</div>
    <div class="days" id="days">1</div>
    <div class="unit">일째</div>
    <div class="heart">♥</div>
  </main>

  <script>
    const startDate = new Date(2026, 9, 14);

    function updateDays() {
      const now = new Date();

      const start = Date.UTC(
        startDate.getFullYear(),
        startDate.getMonth(),
        startDate.getDate()
      );

      const today = Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      const elapsed = Math.floor(
        (today - start) / 86400000
      ) + 1;

      document.getElementById("days").textContent =
        Math.max(1, elapsed).toLocaleString("ko-KR");
    }

    updateDays();
    setInterval(updateDays, 60000);
  </script>
</body>
</html>
